<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소비와 심리 문제은행</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--muted:#667085;--line:#e3e6eb;--accent:#1f4e79;--accent-soft:#e8eff7;--ok:#1a7f4b;--ok-soft:#e6f4ec;--bad:#b42318;--bad-soft:#fdecea}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--text:#e8eaee;--muted:#9aa3b2;--line:#2e343e;--accent:#7fb2e5;--accent-soft:#1f2b3a;--ok:#5cc98d;--ok-soft:#173327;--bad:#f08b80;--bad-soft:#3a1d1b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
header h1{font-size:1.35rem;margin:0 0 4px}
header p{margin:0;color:var(--muted);font-size:.9rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px}
.label{font-size:.8rem;color:var(--muted);margin:0 0 8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:7px 14px;font-size:.92rem;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--card)}
.row{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px}
.row > div{flex:1;min-width:200px}
.btn{border:0;background:var(--accent);color:var(--card);font-weight:700;border-radius:10px;padding:12px 18px;font-size:1rem;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.start{width:100%;margin-top:16px}
.stats{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted)}
.qtext{font-size:1.08rem;font-weight:700;margin:14px 0 14px}
.qtext b{color:var(--accent);margin-right:6px}
.opt{display:block;width:100%;text-align:left;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:.98rem;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--ok-soft);border-color:var(--ok);font-weight:600}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.feedback{border-radius:10px;padding:12px 14px;margin-top:6px;font-size:.95rem}
.feedback.ok{background:var(--ok-soft)}
.feedback.no{background:var(--bad-soft)}
.feedback strong{display:block;margin-bottom:4px}
.feedback small{color:var(--muted)}
.nav{display:flex;gap:8px;margin-top:16px}
.nav .btn{flex:1}
.score{font-size:2.4rem;font-weight:800;color:var(--accent);margin:4px 0}
.list{margin-top:12px;padding:0;list-style:none}
.list li{border-top:1px solid var(--line);padding:10px 0;font-size:.92rem}
.list li span{color:var(--muted)}
.hidden{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{white-space:nowrap;background:none;border:0;color:var(--accent);cursor:pointer;font-size:.9rem;padding:4px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>소비와 심리 문제은행</h1>
      <p>중간고사 대비 객관식 65문항 · 강의교안 0~7-3강</p>
    </div>
    <button class="link hidden" id="homeBtn">처음으로</button>
  </header>

  <section id="setup">
    <div class="panel">
      <p class="label">범위</p>
      <div class="chips" id="secChips"></div>
      <div class="row">
        <div>
          <p class="label">출제 대상</p>
          <div class="chips" id="poolChips"></div>
        </div>
        <div>
          <p class="label">순서</p>
          <div class="chips" id="orderChips"></div>
        </div>
      </div>
      <button class="btn start" id="startBtn">시작하기</button>
      <div class="stats" id="stats"></div>
    </div>
  </section>

  <section id="quiz" class="hidden">
    <div class="panel">
      <div class="meta"><span id="pos"></span><span id="live"></span></div>
      <div class="bar"><i id="prog"></i></div>
      <div class="qtext" id="qtext"></div>
      <div id="opts"></div>
      <div id="fb"></div>
      <div class="nav">
        <button class="btn ghost" id="prevBtn">이전</button>
        <button class="btn" id="nextBtn">다음</button>
      </div>
    </div>
  </section>

  <section id="result" class="hidden">
    <div class="panel">
      <p class="label">결과</p>
      <div class="score" id="score"></div>
      <div id="resultMsg" class="meta"></div>
      <div class="nav">
        <button class="btn ghost" id="retryWrongBtn">틀린 문제 다시 풀기</button>
        <button class="btn" id="againBtn">처음으로</button>
      </div>
      <ul class="list" id="wrongList"></ul>
    </div>
  </section>
</div>

<script>
const Q = [{"n": 1, "s": "1~3강", "q": "1879년 독일 라이프치히 대학에 최초의 심리실험실을 세운 심리학의 창시자는?", "o": ["윌리엄 제임스", "빌헬름 분트", "존 왓슨", "지그문트 프로이트"], "a": 1, "e": "분트, 1879년 라이프치히 최초 심리실험실", "l": "1강"}, {"n": 2, "s": "1~3강", "q": "이미 밝혀진 여러 연구결과 수치를 통계적 절차로 재가공하여 하나의 일반적 결론을 도출하는 자료처리 방법은?", "o": ["내용분석", "사례연구", "통계분석", "메타분석"], "a": 3, "e": "기존 연구결과 통합 = 메타분석. 통계분석은 자기 자료의 평균·ANOVA 등", "l": "3강"}, {"n": 3, "s": "1~3강", "q": "\"전체는 부분의 합과 다르다\"라는 말과 관련된 학파와 그 학파의 주된 관심영역을 올바르게 짝지은 것은?", "o": ["행동주의 – 학습", "정신분석학 – 무의식", "형태주의 – 지각", "기능주의 – 의식"], "a": 2, "e": "형태주의(게슈탈트)의 관심영역은 지각", "l": "1강"}, {"n": 4, "s": "1~3강", "q": "존 왓슨의 행동주의에 대한 설명으로 옳은 것은?", "o": ["관찰 가능한 행동에 관심을 두고, 환경이 습관을 강화함으로써 행동이 만들어진다고 보았다.", "내성법으로 피험자의 주관적 연상을 자기보고하게 했다.", "인간 정신의 대부분은 무의식이라고 보았다.", "의식의 전체적인 기능이 중요하다고 보았다."], "a": 0, "e": "② 분트 ③ 프로이트 ④ 제임스", "l": "1강"}, {"n": 5, "s": "1~3강", "q": "인지심리학에 대한 설명으로 틀린 것은?", "o": ["1950~60년대에 탄생했다.", "인간을 정보처리자로 간주한다.", "내성법을 주된 연구방법론으로 채택했다.", "구성주의의 연구주제를 부활시켰다."], "a": 2, "e": "인지심리학은 '실험' 방법론을 채택해 객관성을 확보했다. 내성법은 분트", "l": "1강"}, {"n": 6, "s": "1~3강", "q": "미국에서 소비자심리학 분과가 설립된 시기와 순서로 옳은 것은?", "o": ["1950년, 미국심리학회 11번째 분과", "1960년, 미국심리학회 23번째 분과", "1979년, 미국심리학회 23번째 분과", "1999년, 미국심리학회 11번째 분과"], "a": 1, "e": "1960년 미국심리학회 23번째 분과", "l": "1강"}, {"n": 7, "s": "1~3강", "q": "한국소비자·광고심리학회의 설립에 대한 설명으로 옳은 것은?", "o": ["1999년, 한국심리학회의 11번째 학회", "1990년, 한국심리학회의 11번째 학회", "1999년, 한국심리학회의 23번째 학회", "1960년, 한국심리학회의 23번째 학회"], "a": 0, "e": "1999년 한국심리학회 11번째 학회. 미국(1960·23번째)과 숫자를 바꾸는 함정 주의", "l": "1강"}, {"n": 8, "s": "1~3강", "q": "무의식을 중시하며 무의식이 꿈·말실수·매너리즘으로 표현된다고 본 인물은?", "o": ["빌헬름 분트", "막스 베르트하이머", "지그문트 프로이트", "윌리엄 제임스"], "a": 2, "e": "프로이트 정신분석학", "l": "1강"}, {"n": 9, "s": "1~3강", "q": "강의에서 제시한 소비자행동의 종합적 정의로 가장 적절한 것은?", "o": ["상품을 구매하는 순간의 물리적 행동만을 말한다.", "획득부터 사용까지의 활동이며, 폐기는 제외된다.", "획득·소비부터 폐기까지의 물리적 활동과 그 전후의 심리적 의사결정과정을 포함한다.", "심리적 의사결정과정은 제외하고 관찰 가능한 행동만 포함한다."], "a": 2, "e": "획득·소비부터 폐기까지 + 전후의 심리적 의사결정과정", "l": "2강"}, {"n": 10, "s": "1~3강", "q": "소비자행동의 본질에 포함되는 내용이 아닌 것은?", "o": ["태도와 태도변화 같은 인지적 활동", "사용 후 평가를 재구매에 피드백하는 활동", "불매운동·소비자주권운동", "기업의 생산원가 결정 활동"], "a": 3, "e": "본질에는 인지적 활동, 피드백, 집단·사회적 활동이 포함. 생산원가는 기업 활동", "l": "2강"}, {"n": 11, "s": "1~3강", "q": "소비자행동의 일반적 모형에서 '외적 요인(자극)'에 해당하지 않는 것은?", "o": ["준거집단", "성격", "하위문화", "경제 동향"], "a": 1, "e": "성격은 내적 요인", "l": "2강"}, {"n": 12, "s": "1~3강", "q": "소비자행동의 일반적 모형에서 '보이지 않는 반응'에 해당하는 것은?", "o": ["태도변화", "점포 방문", "구매량", "제품 선택"], "a": 0, "e": "방문·구매량·선택은 보이는 반응", "l": "2강"}, {"n": 13, "s": "1~3강", "q": "EBM 모델에 대한 설명으로 옳은 것은?", "o": ["자극과 반응만으로 구성된 단순모형이다.", "특정 구매행동이 어떻게 형성되었는가에 초점을 둔 포괄적 의사결정모형이다.", "소비자 행동에 대한 설명력이 낮다는 한계가 있다.", "구매 후 행동은 다루지 않는다."], "a": 1, "e": "EBM은 포괄적 의사결정모형, 설명력이 높음", "l": "2강"}, {"n": 14, "s": "1~3강", "q": "수업용 소비자심리학 모델에서 '정보처리과정'에 포함되지 않는 것은?", "o": ["노출", "대안의 평가", "기억", "학습"], "a": 1, "e": "대안의 평가는 의사결정과정. 정보처리과정은 노출·주의·지각·기억·학습", "l": "2강"}, {"n": 15, "s": "1~3강", "q": "자이가르닉 효과의 사례로 보기 어려운 것은?", "o": ["주문을 계산 전까지 잘 기억하는 식당 종업원", "결정적 장면 직전에 '잠시 중단'하는 방송", "브랜드명을 숨긴 티저광고", "비슷한 항목 중 독특한 항목이 더 잘 기억되는 현상"], "a": 3, "e": "폰 레스토프 효과에 대한 설명", "l": "2-1강, 6-2강"}, {"n": 16, "s": "1~3강", "q": "티저광고에 대한 설명으로 틀린 것은?", "o": ["첫 광고에서 브랜드명과 가격을 모두 공개한 뒤 점차 정보를 줄여 나간다.", "불완전한 정보를 제공해 궁금증을 유발한다.", "'teaser'는 놀려대는 사람이라는 뜻이다.", "인간의 호기심에 호소하는 광고이다."], "a": 0, "e": "브랜드명을 숨기고 시작해 마지막에 공개하는 단계적 노출", "l": "2-1강"}, {"n": 17, "s": "1~3강", "q": "질적 연구의 특성으로 옳은 것은?", "o": ["특정 가설을 통계적으로 검증하기 위해 설계한다.", "정의되지 않은 문제에 통찰을 주기 위해 설계되며, 소수 사례로 주관적 특성을 강조한다.", "표본이 모집단을 잘 대표해야 한다.", "결과를 일반화하기 쉽다."], "a": 1, "e": "①③은 양적 연구, 질적 연구는 일반화가 어렵다", "l": "3강"}, {"n": 18, "s": "1~3강", "q": "하루를 재구성하여 사람들이 시간을 보내는 유형과 각 경험에 대한 느낌을 추적하는 질적 연구 방법은?", "o": ["문화기술지적 연구", "담론분석", "사례연구", "일상재구성법(DRM)"], "a": 3, "e": "Day Reconstruction Method", "l": "3강"}, {"n": 19, "s": "1~3강", "q": "FGI(Focus Group Interview)에 대한 설명으로 옳은 것은?", "o": ["6~8명의 참여자가 진행자의 진행에 맞추어 자유롭게 의견을 나눈다.", "연구자와 응답자가 1:1로 진행하는 면접이다.", "다수의 의견이므로 별도 검증 없이 일반화할 수 있다.", "양적 연구의 자료처리 방법이다."], "a": 0, "e": }
function filtered(){
  let l = Q.filter(q=> state.sec==='전체' || q.s===state.sec);
  if(state.pool==='wrong') l = l.filter(q=> store.wrong.includes(q.n));
  if(state.pool==='new') l = l.filter(q=> !(q.n in store.seen));
  return l;
}
function renderSetup(){
  chips(document.getElementById('secChips'), SECS.map(s=>[s, s==='전체'?'전체 (65)':`${s} (${Q.filter(q=>q.s===s).length})`]), 'sec');
  chips(document.getElementById('poolChips'), [['all','모든 문제'],['wrong',`오답노트 (${store.wrong.length})`],['new','안 푼 문제']], 'pool');
  chips(document.getElementById('orderChips'), [['seq','번호순'],['rand','무작위']], 'order');
  const n = filtered().length;
  const sb = document.getElementById('startBtn');
  sb.disabled = n===0;
  sb.textContent = n ? `${n}문항 시작하기` : '해당하는 문제가 없습니다';
  const seen = Object.keys(store.seen).length;
  const right = Object.values(store.seen).filter(v=>v).length;
  document.getElementById('stats').innerHTML =
    `<span>푼 문제 ${seen}/65</span><span>· 최근 정답 ${right}</span><span>· 오답노트 ${store.wrong.length}</span>` +
    (seen? ` <button class="link" id="resetBtn">기록 초기화</button>`:'');
  const rb=document.getElementById('resetBtn');
  if(rb) rb.onclick=()=>{ if(confirm('풀이 기록과 오답노트를 모두 지울까요?')){ store={wrong:[],seen:{}}; save(); renderSetup(); } };
}
function show(id){
  ['setup','quiz','result'].forEach(s=>document.getElementById(s).classList.toggle('hidden', s!==id));
  document.getElementById('homeBtn').classList.toggle('hidden', id==='setup');
  window.scrollTo(0,0);
}
function start(list){
  state.list = list.slice();
  if(state.order==='rand') for(let i=state.list.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [state.list[i],state.list[j]]=[state.list[j],state.list[i]]; }
  state.i=0; state.answers={};
  show('quiz'); renderQ();
}
function renderQ(){
  const q = state.list[state.i], total=state.list.length;
  const picked = state.answers[q.n];
  document.getElementById('pos').textContent = `${state.i+1} / ${total} · ${q.s}`;
  const done = Object.keys(state.answers).length;
  const ok = state.list.filter(x=>state.answers[x.n]===x.a).length;
  document.getElementById('live').textContent = `맞힌 문제 ${ok} / 푼 문제 ${done}`;
  document.getElementById('prog').style.width = (done/total*100)+'%';
  document.getElementById('qtext').innerHTML = `<b>${q.n}.</b>${q.q}`;
  const opts = document.getElementById('opts'); opts.innerHTML='';
  q.o.forEach((t,k)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.textContent = `${MARK[k]} ${t}`;
    if(picked!==undefined){
      b.disabled=true;
      if(k===q.a) b.classList.add('correct');
      else if(k===picked) b.classList.add('wrong');
    }
    b.onclick=()=>answer(q,k);
    opts.appendChild(b);
  });
  const fb=document.getElementById('fb');
  if(picked===undefined){ fb.innerHTML=''; }
  else{
    const right = picked===q.a;
    fb.innerHTML = `<div class="feedback ${right?'ok':'no'}"><strong>${right?'정답입니다':'오답입니다 · 정답 '+MARK[q.a]}</strong>${q.e}<br><small>근거: ${q.l}</small></div>`;
  }
  document.getElementById('prevBtn').disabled = state.i===0;
  document.getElementById('nextBtn').textContent = state.i===total-1 ? '결과 보기' : '다음';
}
function answer(q,k){
  if(state.answers[q.n]!==undefined) return;
  state.answers[q.n]=k;
  const right = k===q.a;
  store.seen[q.n]=right;
  if(right) store.wrong = store.wrong.filter(n=>n!==q.n);
  else if(!store.wrong.includes(q.n)) store.wrong.push(q.n);
  save(); renderQ();
}
function finish(){
  const total=state.list.length;
  const ok=state.list.filter(x=>state.answers[x.n]===x.a).length;
  const wrong=state.list.filter(x=>state.answers[x.n]!==x.a);
  document.getElementById('score').textContent = `${ok} / ${total}`;
  const skipped = state.list.filter(x=>state.answers[x.n]===undefined).length;
  document.getElementById('resultMsg').innerHTML = `<span>정답률 ${Math.round(ok/total*100)}%</span><span>${skipped?`안 푼 문제 ${skipped}개 포함`:''}</span>`;
  const ul=document.getElementById('wrongList');
  ul.innerHTML = wrong.map(q=>`<li><b>${q.n}.</b> ${q.q}<br><span>정답 ${MARK[q.a]} ${q.o[q.a]} · ${q.l}</span></li>`).join('');
  document.getElementById('retryWrongBtn').disabled = wrong.length===0;
  document.getElementById('retryWrongBtn').onclick=()=>{ state.order='seq'; start(wrong); };
  show('result');
}
document.getElementById('startBtn').onclick=()=>start(filtered());
document.getElementById('prevBtn').onclick=()=>{ if(state.i>0){ state.i--; renderQ(); window.scrollTo(0,0);} };
document.getElementById('nextBtn').onclick=()=>{ if(state.i<state.list.length-1){ state.i++; renderQ(); window.scrollTo(0,0);} else finish(); };
document.getElementById('againBtn').onclick=()=>{ show('setup'); renderSetup(); };
document.getElementById('homeBtn').onclick=()=>{ show('setup'); renderSetup(); };
document.addEventListener('keydown',e=>{
  if(document.getElementById('quiz').classList.contains('hidden')) return;
  const q=state.list[state.i];
  if(['1','2','3','4'].includes(e.key)) answer(q, +e.key-1);
  if(e.key==='ArrowRight') document.getElementById('nextBtn').click();
  if(e.key==='ArrowLeft') document.getElementById('prevBtn').click();
});
renderSetup();
</script>
</body>
</html>
